<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Termux-OS Administration</title>
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="menu-button" id="menu-button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
      <a class="brand" href="/admin/status/overview">Termux-OS <span>Control center</span></a>
      <span class="top-meta" id="version">-</span>
    </header>
    <aside class="sidebar" id="sidebar">
      <nav id="navigation" aria-label="Administration"></nav>
      <button class="logout" id="logout" type="button">Logout</button>
    </aside>
    <button class="nav-scrim" id="nav-scrim" type="button" aria-label="Close navigation" hidden></button>
    <main class="content">
      <header class="page-head">
        <p class="breadcrumb" id="breadcrumb">Status / Overview</p>
        <h1 id="page-title">Overview</h1>
        <p class="description" id="page-description">System health and items that need attention.</p>
      </header>
      <div id="page" aria-live="polite">
        <div class="loading">Loading current state…</div>
      </div>
    </main>
  </div>
  <dialog id="confirm-dialog" class="confirm-dialog">
    <form method="dialog">
      <h2 id="confirm-title">Confirm action</h2>
      <div id="confirm-details" class="confirm-details"></div>
      <p class="alert warning">This action changes the installed system. Verify the identity and preservation notes.</p>
      <label id="confirm-ack-wrap" class="confirm-ack" hidden>
        <input id="confirm-ack" type="checkbox">
        <span id="confirm-ack-text"></span>
      </label>
      <div class="button-row">
        <button value="cancel">Cancel</button>
        <button value="confirm" id="confirm-submit" class="danger">Confirm</button>
      </div>
    </form>
  </dialog>
  <script src="/admin/session.js"></script>
  <script src="/admin/app-core.js"></script>
  <script src="/admin/admin-controls.js"></script>
  <script src="/admin/app.js"></script>
</body>
</html>
