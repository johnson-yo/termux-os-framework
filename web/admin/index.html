<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Termux-OS 控制台</title>
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="menu-button" id="menu-button" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false">☰</button>
      <a class="brand" href="/admin/status/overview">Termux-OS <span>控制中心</span></a>
      <span class="top-meta" id="version">-</span>
    </header>
    <aside class="sidebar" id="sidebar">
      <nav id="navigation" aria-label="Administration"></nav>
      <button class="logout" id="logout" type="button">退出登录</button>
    </aside>
    <button class="nav-scrim" id="nav-scrim" type="button" aria-label="关闭导航" hidden></button>
    <div class="install-bar" id="install-bar" hidden>
      <span>把控制台装到桌面，以后不用先开浏览器找网址。</span>
      <button type="button" class="primary" id="install-accept">安装</button>
      <button type="button" id="install-dismiss" aria-label="不再提示">✕</button>
    </div>
    <main class="content">
      <header class="page-head">
        <p class="breadcrumb" id="breadcrumb">状态 / 概览</p>
        <h1 id="page-title">概览</h1>
        <p class="description" id="page-description">系统健康状况，以及需要你处理的事项。</p>
      </header>
      <div id="page" aria-live="polite">
        <div class="loading">正在读取当前状态…</div>
      </div>
    </main>
  </div>
  <dialog id="confirm-dialog" class="confirm-dialog">
    <form method="dialog">
      <h2 id="confirm-title">确认操作</h2>
      <div id="confirm-details" class="confirm-details"></div>
      <p class="alert warning">这个操作会改动已安装的系统。请先核对下面的身份信息与影响说明。</p>
      <label id="confirm-ack-wrap" class="confirm-ack" hidden>
        <input id="confirm-ack" type="checkbox">
        <span id="confirm-ack-text"></span>
      </label>
      <div class="button-row">
        <button value="cancel">Cancel</button>
        <button value="confirm" id="confirm-submit" class="danger">Confirm</button>
      </div>
    </form>
  </dialog>
  <script src="/admin/session.js"></script>
  <script src="/admin/app-core.js"></script>
  <script src="/admin/admin-controls.js"></script>
  <script src="/admin/app.js"></script>
</body>
</html>
